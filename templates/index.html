<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="site-wrapper">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="brand">
                    <span class="brand-name">Fake News Detector</span>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="main-content">
            <!-- Headline -->
            <section class="intro">
                <h1>Analyze News Authenticity</h1>
                <p>Paste a news headline or complete article below to predict whether it is real or fake.</p>
            </section>

            <!-- Input Card -->
            <div class="card input-card">
                <div class="card-header">
                    <label for="news-input">News Article or Headline</label>
                    <div class="counter">
                        <span id="word-count">0 words</span>
                        <span class="sep">•</span>
                        <span id="char-count">0 characters</span>
                    </div>
                </div>

                <textarea 
                    id="news-input" 
                    placeholder="Enter or paste article text here..." 
                    rows="7"
                ></textarea>

                <div class="card-footer">
                    <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to analyze</span>
                    <div class="actions">
                        <button type="button" id="clear-btn" class="btn-secondary">Clear</button>
                        <button type="button" id="analyze-btn" class="btn-primary">
                            <span class="btn-text">Analyze News</span>
                            <span class="spinner hidden" id="loading-spinner"></span>
                        </button>
                    </div>
                </div>

                <!-- Error Alert -->
                <div id="error-banner" class="error-alert hidden" role="alert">
                    <span id="error-message"></span>
                </div>
            </div>

            <!-- Result Card -->
            <div id="result-card" class="card result-card hidden" aria-live="polite">
                <div class="result-top">
                    <div class="verdict-block">
                        <span class="verdict-tag" id="verdict-tag">REAL NEWS</span>
                    </div>
                    <div class="confidence-block">
                        <span class="confidence-label">Confidence</span>
                        <span class="confidence-number" id="confidence-val">95.5%</span>
                    </div>
                </div>

                <!-- Confidence Bar -->
                <div class="bar-track">
                    <div class="bar-fill" id="confidence-bar"></div>
                </div>

                <!-- Key Words -->
                <div class="words-section">
                    <span class="section-subtitle">Influential Terms Detected:</span>
                    <div class="words-list" id="feature-tags-container">
                        <!-- Filled by JS -->
                    </div>
                </div>

                <!-- Explanation -->
                <div class="explanation-box">
                    <p id="explanation-text"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
